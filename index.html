    <script>
        let currentTheme = "";
        let chatStep = 0;
        let selectedPlanType = "deep";
        let messageHistory = []; // AIとの会話履歴を保持

        async function startChat() {
            const input = document.getElementById("theme-input").value.trim();
            if (!input) {
                alert("テーマを入力してください！");
                return;
            }
            currentTheme = input;
            document.getElementById("step-theme").classList.add("hidden");
            document.getElementById("step-chat").classList.remove("hidden");

            // 初回のAIからの問いかけをAPI経由で取得
            await callAiEngine("こんにちは！「" + currentTheme + "」ですね。非常に面白そうなテーマです。まず、そのテーマについてあなたが一番実感していることを教えてください。");
        }

        async function addMessage(sender, text) {
            const container = document.getElementById("chat-container");
            const div = document.createElement("div");
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} mb-3`;
            div.innerHTML = `
                <div class="max-w-[85%] rounded-2xl px-4 py-3 text-xs leading-relaxed ${sender === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-700 text-slate-200 rounded-bl-none'}">
                    ${text}
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function callAiEngine(initialMessage = null) {
            const container = document.getElementById("chat-container");
            
            if (initialMessage) {
                addMessage("ai", initialMessage);
                messageHistory.push({ role: "assistant", content: initialMessage });
                return;
            }

            // ローディング表示などの演出を入れるとさらに良いです
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        theme: currentTheme,
                        history: messageHistory,
                        step: chatStep
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error);

                const aiReply = data.reply;
                addMessage("ai", aiReply);
                messageHistory.push({ role: "assistant", content: aiReply });

                chatStep++;
                document.getElementById("chat-progress").innerText = `${Math.min(chatStep + 1, 3)} / 3 往復`;

                // 3往復完了したらプラン選択画面へ移行
                if (chatStep >= 3) {
                    setTimeout(() => {
                        document.getElementById("step-chat").classList.add("hidden");
                        document.getElementById("step-pricing").classList.remove("hidden");
                        
                        document.getElementById("insight-summary").innerHTML = `
                            <b>【抽出された一次情報・熱量】</b><br>
                            ・テーマ: ${currentTheme}<br>
                            ・対話を通じて浮き彫りになった独自の視点とエピソードが整理されました。下のコースを選んで決済へ進んでください。
                        `;
                    }, 1500);
                }

            } catch (error) {
                console.error(error);
                alert("AIとの通信でエラーが発生しました。");
            }
        }

        async function sendReply() {
            const inputEl = document.getElementById("user-reply");
            const reply = inputEl.value.trim();
            if (!reply) return;

            addMessage("user", reply);
            messageHistory.push({ role: "user", content: reply });
            inputEl.value = "";

            // AIへ次の返答を依頼
            await callAiEngine();
        }

        function selectPlan(type) {
            selectedPlanType = type;
            if (type === 'light') {
                document.getElementById('plan-light').className = "border-2 border-indigo-500 bg-indigo-950/20 p-4 rounded-xl cursor-pointer shadow-lg";
                document.getElementById('plan-deep').className = "border border-slate-700 bg-slate-900 p-4 rounded-xl cursor-pointer hover:border-indigo-500 transition";
            } else {
                document.getElementById('plan-deep').className = "border-2 border-indigo-500 bg-indigo-950/20 p-4 rounded-xl cursor-pointer shadow-lg";
                document.getElementById('plan-light').className = "border border-slate-700 bg-slate-900 p-4 rounded-xl cursor-pointer hover:border-indigo-500 transition";
            }
        }

        function checkoutAndGenerate() {
            if (selectedPlanType === 'light') {
                window.location.href = "https://buy.stripe.com/EVq7sKftYbmVcFlezkEZ20l";
            } else {
                window.location.href = "https://buy.stripe.com/6oU9ASa9E8aJdJp4YKeZ20m";
            }
        }

        function resetApp() {
            location.reload();
        }
    </script>
